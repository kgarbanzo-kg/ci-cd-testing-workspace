name: dbt CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'dbt/**'
      - '.github/workflows/dbt-ci.yml'

concurrency:
  group: dbt-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

jobs:
  validate-ci:
    runs-on: ubuntu-latest
    environment: ci
    defaults:
      run:
        working-directory: dbt
    env:
      DBT_PROFILES_DIR: .
      DBT_TARGET: ci
      SNOWFLAKE_ACCOUNT: ${{ vars.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: SVC_GITHUB_INFRA_CI
      DBT_ROLE: ${{ vars.DBT_ROLE }}
      SNOWFLAKE_WAREHOUSE: ${{ vars.DBT_WAREHOUSE }}
      DBT_TARGET_DB: ${{ vars.DBT_TARGET_DB }}
      DBT_CI_SCHEMA: PR_${{ github.event.number }}
      TARGET_RAW_DB: ${{ vars.SNOWFLAKE_RAW_DB }}
      SNOWFLAKE_AUTHENTICATOR: WORKLOAD_IDENTITY
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configurar Python y dbt-snowflake
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dbt-snowflake
        run: pip install dbt-snowflake

      - name: Autenticar en Snowflake via OIDC
        uses: snowflakedb/snowflake-actions@v3
        with:
          use-oidc: true
          cli-version: "3.16"

      - name: Probar conexión y construir modelos en CI
        run: |
          export SNOWFLAKE_TOKEN="${SNOWFLAKE_TOKEN}"
          dbt debug
          dbt build --target ci