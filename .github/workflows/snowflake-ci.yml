name: Snowflake Object CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'snowflake/**'
      - '.sqlfluff'
      - '.github/workflows/snowflake-ci.yml'

concurrency:
  group: snowflake-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    environment: ci
    env:
      SNOWFLAKE_ACCOUNT: ${{ vars.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: SVC_GITHUB_INFRA_CI
      SNOWFLAKE_ROLE: CICD_INFRA_ROLE
      SNOWFLAKE_WAREHOUSE: CICD_WH
      TARGET_RAW_DB: ${{ vars.SNOWFLAKE_RAW_DB }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Instalar SQLFluff y gettext (envsubst)
        run: |
          pip install sqlfluff
          sudo apt-get update && sudo apt-get install -y gettext-base

      - name: Validar sintaxis SQL (Snowflake dialect)
        run: sqlfluff parse snowflake/migrations/

      - name: Autenticar en Snowflake via OIDC
        uses: snowflakedb/snowflake-actions@v3
        with:
          use-oidc: true
          cli-version: "3.16"

      - name: Validar ejecución SQL idempotente en Snowflake
        run: |
          for f in snowflake/migrations/*.sql; do
            echo "Validando $f contra ${TARGET_RAW_DB}..."
            envsubst '${TARGET_RAW_DB}' < "$f" > /tmp/rendered.sql
            snow sql -x -f /tmp/rendered.sql
          done