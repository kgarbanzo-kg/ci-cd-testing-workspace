name: Snowflake Object CD

on:
  push:
    branches: [main]
    paths:
      - 'snowflake/**'
      - '.github/workflows/snowflake-cd.yml'

concurrency:
  group: snowflake-cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy-prod:
    runs-on: ubuntu-latest
    environment: prod
    env:
      SNOWFLAKE_ACCOUNT: ${{ vars.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: SVC_GITHUB_INFRA_PROD
      SNOWFLAKE_ROLE: CICD_INFRA_ROLE
      SNOWFLAKE_WAREHOUSE: CICD_WH
      TARGET_RAW_DB: ${{ vars.SNOWFLAKE_RAW_DB }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Instalar gettext (envsubst)
        run: sudo apt-get update && sudo apt-get install -y gettext-base

      - name: Autenticar en Snowflake via OIDC
        uses: snowflakedb/snowflake-actions@v3
        with:
          use-oidc: true
          cli-version: "3.16"

      - name: Aplicar scripts SQL idempotentes en Snowflake
        run: |
          for f in snowflake/migrations/*.sql; do
            echo "Aplicando $f en ${TARGET_RAW_DB}..."
            envsubst '${TARGET_RAW_DB}' < "$f" > /tmp/rendered.sql
            snow sql -x -f /tmp/rendered.sql
          done