snowflake_dbt:
  target: "{{ env_var('DBT_TARGET', 'ci') }}"
  outputs:
    ci:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('SNOWFLAKE_USER') }}"
      role: "{{ env_var('DBT_ROLE', 'CICD_DBT_ROLE') }}"
      warehouse: "{{ env_var('DBT_WAREHOUSE', 'CICD_WH') }}"
      database: "{{ env_var('DBT_TARGET_DB', 'ANALYTICS_DB') }}"
      schema: "{{ env_var('DBT_CI_SCHEMA', 'STAGING_CI') }}"
      threads: 4
      authenticator: "{{ env_var('SNOWFLAKE_AUTHENTICATOR', 'WORKLOAD_IDENTITY') }}"
      workload_identity_provider: "{{ env_var('SNOWFLAKE_WORKLOAD_IDENTITY_PROVIDER', 'OIDC') }}"
      token: "{{ env_var('SNOWFLAKE_TOKEN', '') }}"
    prod:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('SNOWFLAKE_USER') }}"
      role: "{{ env_var('DBT_ROLE', 'CICD_DBT_ROLE') }}"
      warehouse: "{{ env_var('DBT_WAREHOUSE', 'CICD_WH') }}"
      database: "{{ env_var('DBT_TARGET_DB', 'ANALYTICS_DB') }}"
      schema: "{{ env_var('DBT_PROD_SCHEMA', 'STAGING') }}"
      threads: 4
      authenticator: "{{ env_var('SNOWFLAKE_AUTHENTICATOR', 'WORKLOAD_IDENTITY') }}"
      workload_identity_provider: "{{ env_var('SNOWFLAKE_WORKLOAD_IDENTITY_PROVIDER', 'OIDC') }}"
      token: "{{ env_var('SNOWFLAKE_TOKEN', '') }}"